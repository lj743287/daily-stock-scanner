name: Daily Scan (build universe + scan)

on:
  workflow_dispatch:
  schedule:
    # Daily at 01:00 UTC
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  build_universe_and_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Ensure main is up to date
        run: |
          set -e
          git fetch origin main
          git checkout main
          git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build universe.txt from Twelve Data
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          UNIVERSE_MIN_PRICE: "1.50"
          TD_MAX_REQUESTS_PER_MINUTE: "50"
          UNIVERSE_OUTFILE: "universe.txt"
        run: |
          python build_universe.py

      - name: Commit and push updated universe.txt (if changed)
        run: |
          set -e

          if git status --porcelain | grep -q "^ M universe.txt\|^?? universe.txt"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add universe.txt
            git commit -m "Update universe.txt" || echo "Nothing to commit"

            git fetch origin main
            git rebase origin/main || (git rebase --abort && exit 1)

            git push origin main
          else
            echo "No changes to universe.txt"
          fi

      - name: Run daily scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scanner.py
