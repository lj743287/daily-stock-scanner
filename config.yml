api:
  interval: 1day

  # Enough history for a 60-trading-day return calc (+ buffer)
  outputsize: 200

  # Batch symbols per API call (1 symbol ~= 1 credit)
  batch_size: 50

  # Provider per-minute cap (Grow 55 == 55 credits/min)
  max_api_credits_per_min: 50

rule:
  lookback_bars: 60
  min_return_pct: 30.0
