api:
  interval: 1day
  outputsize: 260

  # Keep batch_size small on the free plan.
  # Each symbol in a batch still costs 1 credit.
  batch_size: 8

  # OLD setting (the current code still reads this for sleeping)
  max_requests_per_min: 8

  # NEW setting (we will switch the code to use this next)
  # Free Basic is 8 API credits per minute, and 800 per day.
  max_api_credits_per_min: 8

filters:
  near_52w_high_pct: 25
  min_dollar_vol_50d: 10000000

indicators:
  ema_fast: 10
  ema_mid: 20
  ema_slow: 50
  sma_slow: 200
  atr_len: 14

setup_base_breakout:
  base_lookback: 30
  base_max_depth_pct: 15
  breakout_buffer_pct: 0.2
  vol_multiplier: 1.2
  atr_stop_mult: 2.0
