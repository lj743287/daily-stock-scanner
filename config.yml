api:
  interval: 1day
  outputsize: 260
  batch_size: 8
  max_api_credits_per_min: 8
  max_tickers_per_run: 300

indicators:
  ema_fast: 10
  ema_mid: 20
  ema_slow: 50
  sma_fast: 50
  sma_mid: 150
  sma_slow: 200
  atr_len: 14

filters:
  near_52w_high_pct: 25

setup_qullamaggie_breakout:
  enabled: true
  impulse_lookback: 60
  impulse_min_pct: 30
  cons_min_bars: 10
  cons_max_bars: 40
  cons_max_depth_pct: 15
  cons_max_up_drift_pct: 10
  cons_max_down_drift_pct: 15
  higher_low_tol_pct: 2
  pivot_exclude_last_n: 2
  breakout_buffer_pct: 0.2
  surf_close_min_pct: 70
  surf_max_dist_pct: 6
  ma_slope_lookback: 5
  max_ext_pct_above_surf_ma: 8
  max_ext_atr_mult_above_surf_ma: 3
  max_breakout_extension_pct: 4
  stop_width_atr_mult: 1.0

setup_minervini_vcp:
  enabled: true
  lookback_bars: 65
  pivot_exclude_last_n: 5
  vcp_max_depth_pct: 35
  vcp_ratio_12: 0.90
  vcp_ratio_23: 0.90
  vol_dryup_mult: 0.85
  breakout_buffer_pct: 0.2
  near_breakout_pct: 3
  max_breakout_extension_pct: 4
  max_ext_above_sma50_pct: 12

setup_minervini_3wt:
  enabled: true
  bars: 15
  max_range_pct: 8
  max_drift_pct: 8
  breakout_buffer_pct: 0.2
  near_breakout_pct: 3
  max_breakout_extension_pct: 4
  max_ext_above_sma50_pct: 12
