api:
  interval: 1day

  # VCP scanning needs enough history for up to 60 weeks + pretrend context
  # 60w ~ 300 bars, pretrend ~ 100 bars, plus buffer => ~520
  outputsize: 520

  # Batch symbols per API call (1 symbol ~= 1 credit)
  batch_size: 50

  # Provider per-minute cap (Grow 55 == 55 credits/min)
  max_api_credits_per_min: 50

vcp:
  # -------------------------
  # Base window (weeks)
  # -------------------------
  min_base_weeks: 3
  max_base_weeks: 60

  # Scoring preference (boost)
  prefer_base_weeks_min: 6
  prefer_base_weeks_max: 12

  # The "left-side high" must occur in the left portion of the base window (loosened)
  left_high_max_pos_frac: 0.50

  # "in base" rule: price must not make a decisive new high above the left-side high (loosened)
  base_top_overshoot_tol_pct: 1.5

  # -------------------------
  # Prior uptrend context (no MAs) (loosened)
  # -------------------------
  pretrend_bars: 100
  min_pretrend_return_pct: 10
  require_positive_pretrend_slope: true

  # -------------------------
  # Contractions (T count)
  # -------------------------
  min_contractions: 2
  max_contractions: 6

  # Reject very messy bases
  reject_if_contractions_gt: 8

  # Shrinking logic (loosened per your instructions)
  shrink_step_mult: 0.92
  shrink_steps_min_frac: 0.45
  allow_one_exception: true
  exception_step_mult: 1.20
  last_vs_first_max_mult: 0.70

  # Final contraction tightness (loosened)
  max_last_contraction_pct: 15

  # Overall base depth from left-side high to base low (cap)
  max_base_depth_pct: 50

  # -------------------------
  # Pivot / entry
  # -------------------------
  pivot_use_last_rebound_peak: true
  pivot_exclude_last_n_bars: 2

  entry_buffer_pct: 0.20
  near_breakout_pct: 8.0

  # Risk cap REMOVED (no vcp.max_stop_pct_trade)

  # -------------------------
  # Pivot detection (swing pivots)
  # -------------------------
  pivots:
    left_bars_options: [3, 4, 5, 6, 7]
    right_bars_options: [3, 4, 5, 6, 7]

  # -------------------------
  # Tightening on the right side (loosened)
  # -------------------------
  tightening:
    atr_len: 14
    atrp_right_to_left_max: 0.90
    atrp_right_to_left_pref: 0.70

    right_segment_bars: 15
    right_range_max_pct: 10.0
    right_range_max_pct_soft: 12.0
    right_close_top_half_min_pct: 55.0

  # -------------------------
  # Volume behaviour (loosened)
  # -------------------------
  volume:
    # "high volume rallies - low volume pullbacks"
    min_rally_to_pullback_ratio: 0.90

    # "low volume out - high volume in" violation proxy (loosened)
    bearish_pullback_to_rally_ratio: 1.25

    min_pairs_required: 1

  # -------------------------
  # Breakout confirmation (loosened)
  # -------------------------
  breakout:
    # price_trigger: close OR high
    price_trigger: high
    breakout_vol_mult: 1.10
    breakout_vol_ma: 20
    breakout_vol_min: 0

  # -------------------------
  # Optional handle sweet spot
  # -------------------------
  handle:
    enabled: true
    last_low_min_pos_frac: 0.60
    min_chop_bars: 5
    max_chop_range_pct: 6.0

  # -------------------------
  # Fail filters (loosened)
  # -------------------------
  fail_filters:
    # If max contraction depth is less than this, treat as a grind up, not a base (loosened)
    min_meaningful_contraction_pct: 5.0

    # Right-side volatility expansion: last contraction too big vs previous (loosened)
    max_last_depth_vs_prev_mult: 1.35

    # Wide-range down bars on right side (loosened)
    wide_down_bars_min: 3
    wide_down_tr_mult: 1.75
    right_fail_lookback_bars: 15
